# Netlify: no build step, the game is the single file in dist/.
[build]
  publish = "dist"
  command = ""

# Browsers must always recheck the service worker so new builds reach installed players.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
