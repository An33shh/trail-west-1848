<title>Trail West 1848</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: a green phosphor monitor on a dark desk. Hi-res picture on top, 40-column text terminal below. */
:root {
  --desk: #0d0f0c;
  --bezel: #2a2b25;
  --bezel-hi: #3b3c34;
  --glass: #020602;
  --phos: #40ff60;
  --phos-dim: #1f8a33;
  --phos-faint: #0e3a17;
  --font-term: 'VT323', 'Courier New', ui-monospace, monospace;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--phos);
  font-family: var(--font-term);
}

.room {
  min-height: 100%;
  box-sizing: border-box;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.monitor {
  width: 100%;
  max-width: 720px;
  background: linear-gradient(var(--bezel-hi), var(--bezel));
  border-radius: 18px;
  padding: clamp(10px, 3vw, 22px);
  box-sizing: border-box;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}

.glass {
  position: relative;
  background: var(--glass);
  border-radius: 12px;
  overflow: hidden;
  padding: clamp(8px, 2.5vw, 18px);
  container-type: inline-size;
  box-shadow: inset 0 0 40px rgba(64, 255, 96, 0.07);
}
/* scanlines and vignette over everything on the glass */
.glass::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.5) 100%);
}

#scene {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 280 / 160;
  max-width: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  filter: drop-shadow(0 0 2px rgba(64, 255, 96, 0.55));
  touch-action: none;
}
#scene[hidden] { display: none; }

/* 40 columns of VT323 fit the glass width at any size */
.term {
  font-size: calc(100cqi / 21);
  line-height: 1.05;
  margin-top: 0.5em;
  min-height: 12em;
  text-shadow: 0 0 4px rgba(64, 255, 96, 0.6);
  overflow-wrap: anywhere;
}
.term .line { white-space: pre-wrap; min-height: 1.05em; }
.term .art { white-space: pre; overflow-x: auto; }
.term .dim { color: var(--phos-dim); }
.term .inv { background: var(--phos); color: var(--glass); text-shadow: none; }
.term .opt { cursor: pointer; display: block; }
.term .opt:hover, .term .opt:focus-visible { background: var(--phos); color: var(--glass); text-shadow: none; outline: none; }
.term .prompt { display: flex; flex-wrap: wrap; align-items: baseline; white-space: pre-wrap; }
.term input {
  flex: 1;
  min-width: 8ch;
  background: transparent;
  border: 0;
  color: var(--phos);
  font: inherit;
  text-shadow: inherit;
  caret-color: var(--phos);
  padding: 0;
  outline: none;
  text-transform: uppercase;
}
.term input::placeholder { color: var(--phos-faint); }

.cursor { display: inline-block; width: 0.5em; background: var(--phos); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.under {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  margin-top: 10px; color: #8d8f80; font: 15px/1.2 var(--font-term); letter-spacing: 0.08em;
}
.under button {
  font: inherit; color: #c9cbb8; background: #1b1c18; border: 1px solid #45463d; border-radius: 4px;
  padding: 4px 10px; cursor: pointer; letter-spacing: 0.08em;
}
.under .buttons { display: flex; gap: 8px; }
.under button[hidden] { display: none; }
.under button:focus-visible { outline: 2px solid var(--phos); outline-offset: 2px; }
.led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--phos); box-shadow: 0 0 6px var(--phos); margin-right: 8px; vertical-align: middle; }

@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

/* Full-screen CRT for desktops and other landscape screens: the window is the glass.
   Like an Apple II, the screen is a 4:3 area as tall as the window holding 40 columns x about 24 rows.
   VT323 is half as wide as Apple II 40-column text, so the terminal is laid out at half width and
   stretched 2x. The picture shrinks to make room for long menus; anything longer scrolls in the glass. */
@media (orientation: landscape) and (min-width: 900px) and (min-height: 500px) {
  :root {
    --pad: 3dvh;
    --sw: min(100vw - 2 * var(--pad), (100dvh - 2 * var(--pad)) * 4 / 3);
  }
  html, body { background: var(--glass); overflow: hidden; }
  .room { padding: 0; height: 100dvh; display: block; }
  .monitor {
    max-width: none; height: 100%; padding: 0;
    background: none; border-radius: 0; box-shadow: none;
  }
  .glass {
    height: 100%; box-sizing: border-box; border-radius: 0; background: none; box-shadow: none;
    display: flex; flex-direction: column; align-items: flex-start;
    overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
    padding: var(--pad) calc((100vw - var(--sw)) / 2) max(var(--pad), 48px);
  }
  .glass::-webkit-scrollbar { display: none; }
  #scene {
    flex: 0 1 calc(var(--sw) * 160 / 280);
    min-height: 28%;
    width: auto; max-width: 100%;
    align-self: center;
  }
  .term {
    flex: none;
    width: calc(var(--sw) / 2);
    min-height: 0;
    margin-top: 0.4em;
    transform: scaleX(2);
    transform-origin: 0 0;
    text-shadow: 0.5px 0 3px rgba(64, 255, 96, 0.6);
  }
  /* Tube: scanlines, phosphor bloom in the middle, dark rounded edges. Fixed, so it stays put while text scrolls. */
  .glass::after {
    position: fixed; z-index: 1;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, rgba(64, 255, 96, 0.04) 0%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    box-shadow: inset 0 0 6vmin 2vmin rgba(0, 0, 0, 0.85);
    border-radius: 3vmin;
  }
  .under {
    position: fixed; z-index: 2; right: 2.5vmin; bottom: 2vmin; margin: 0;
    opacity: 0.35; transition: opacity 0.2s;
  }
  .under:hover, .under:focus-within { opacity: 1; }
  .under > span:first-child { display: none; }
  .under button { color: var(--phos); background: var(--glass); border-color: var(--phos-dim); }
}
/* In true full screen, drop the controls further out of the way. */
:fullscreen .under { opacity: 0.15; }
</style>
<div class="room">
  <main class="monitor" aria-label="Trail West 1848">
    <div class="glass">
      <canvas id="scene" width="280" height="160" aria-label="Game picture"></canvas>
      <div id="term" class="term" role="log" aria-live="polite"></div>
    </div>
    <div class="under">
      <span><span class="led" aria-hidden="true"></span>TRAIL WEST 1848</span>
      <span class="buttons">
        <button id="install" type="button" hidden>INSTALL</button>
        <button id="fullscreen" type="button" hidden>FULL SCREEN</button>
        <button id="mute" type="button">SOUND ON</button>
      </span>
    </div>
  </main>
</div>

<script>
/*
 * Trail engine: pure game logic, no DOM.
 * Clean-room implementation of the rules in docs/SPEC.md.
 * Runs in the browser (window.OT) and in Node (module.exports) for tests.
 */
(function (root) {
  'use strict';

  // ---------- RNG (mulberry32, seedable for tests) ----------
  function makeRng(seed) {
    let a = seed >>> 0;
    const rng = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    rng.int = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
    rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
    rng.chance = (p) => rng() < p;
    return rng;
  }

  // ---------- Static data ----------
  // 1985 Apple II rules: three occupations, money and score bonus are the only differences.
  const OCCUPATIONS = [
    { id: 'banker', name: 'Be a banker from Boston', cash: 1600, bonus: 1.0, perk: '' },
    { id: 'carpenter', name: 'Be a carpenter from Ohio', cash: 800, bonus: 2.0, perk: '' },
    { id: 'farmer', name: 'Be a farmer from Illinois', cash: 400, bonus: 3.0, perk: '' },
  ];

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const START_MONTHS = [2, 3, 4, 5, 6]; // March..July (0-indexed)

  const BASE_PRICES = { oxen: 20, food: 0.20, clothing: 10, bullets: 2, wheel: 10, axle: 10, tongue: 10 };
  const LIMITS = { oxen: 20, food: 2000, clothing: 99, bullets: 99, wheel: 3, axle: 3, tongue: 3 };
  const ITEM_LABEL = { oxen: 'oxen', food: 'pounds of food', clothing: 'sets of clothing', bullets: 'boxes of bullets', wheel: 'wagon wheels', axle: 'wagon axles', tongue: 'wagon tongues' };

  // Route graph. dist is miles to each entry in next[].
  const LANDMARKS = {
    independence: { name: 'Independence, Missouri', type: 'town', zone: 'plains', next: ['kansas'], dist: [102], x: 0.94, y: 0.62 },
    kansas: { name: 'Kansas River Crossing', type: 'river', zone: 'plains', next: ['bigblue'], dist: [82], x: 0.88, y: 0.58, ferry: 5 },
    bigblue: { name: 'Big Blue River Crossing', type: 'river', zone: 'plains', next: ['kearney'], dist: [118], x: 0.83, y: 0.52, ferry: 5 },
    kearney: { name: 'Fort Kearney', type: 'fort', zone: 'plains', next: ['chimney'], dist: [250], x: 0.76, y: 0.47 },
    chimney: { name: 'Chimney Rock', type: 'natural', zone: 'highplains', next: ['laramie'], dist: [86], x: 0.64, y: 0.44 },
    laramie: { name: 'Fort Laramie', type: 'fort', zone: 'highplains', next: ['indrock'], dist: [190], x: 0.59, y: 0.42 },
    indrock: { name: 'Independence Rock', type: 'natural', zone: 'rockies', next: ['southpass'], dist: [102], x: 0.51, y: 0.39 },
    southpass: { name: 'South Pass', type: 'natural', zone: 'rockies', next: ['green', 'bridger'], dist: [57, 125], x: 0.46, y: 0.40, fork: ['Take the Sublette Cutoff to the Green River', 'Head to Fort Bridger'] },
    green: { name: 'Green River Crossing', type: 'river', zone: 'rockies', next: ['soda'], dist: [144], x: 0.42, y: 0.37, ferry: 5 },
    bridger: { name: 'Fort Bridger', type: 'fort', zone: 'rockies', next: ['soda'], dist: [162], x: 0.42, y: 0.46 },
    soda: { name: 'Soda Springs', type: 'natural', zone: 'highdesert', next: ['hall'], dist: [57], x: 0.36, y: 0.36 },
    hall: { name: 'Fort Hall', type: 'fort', zone: 'snakeplain', next: ['snake'], dist: [182], x: 0.33, y: 0.33 },
    snake: { name: 'Snake River Crossing', type: 'river', zone: 'snakeplain', next: ['boise'], dist: [114], x: 0.24, y: 0.35, guide: true },
    boise: { name: 'Fort Boise', type: 'fort', zone: 'snakeplain', next: ['bluemtns'], dist: [160], x: 0.18, y: 0.30 },
    bluemtns: { name: 'Blue Mountains', type: 'natural', zone: 'cascades', next: ['wallawalla', 'dalles'], dist: [55, 125], x: 0.14, y: 0.24, fork: ['Head to Fort Walla Walla', 'Cut straight to The Dalles'] },
    wallawalla: { name: 'Fort Walla Walla', type: 'fort', zone: 'cascades', next: ['dalles'], dist: [120], x: 0.13, y: 0.15 },
    dalles: { name: 'The Dalles', type: 'dalles', zone: 'cascades', next: ['willamette'], dist: [100], x: 0.08, y: 0.20 },
    willamette: { name: 'Willamette Valley, Oregon', type: 'end', zone: 'cascades', next: [], dist: [], x: 0.03, y: 0.22 },
  };

  const ZONES = {
    plains: { temp: 0, rain: 1.0, speed: 1.0, label: 'prairie' },
    highplains: { temp: -3, rain: 0.7, speed: 1.0, label: 'high plains' },
    rockies: { temp: -15, rain: 0.6, speed: 0.75, label: 'mountains' },
    highdesert: { temp: -6, rain: 0.4, speed: 0.9, label: 'high desert' },
    snakeplain: { temp: -2, rain: 0.35, speed: 0.9, label: 'Snake River plain' },
    cascades: { temp: -8, rain: 1.3, speed: 0.75, label: 'mountains' },
  };
  // Mean daily temperature (F) by month for the plains baseline.
  const MONTH_TEMP = [25, 30, 42, 55, 65, 75, 81, 78, 68, 55, 41, 30];

  const PACES = [
    { id: 'steady', name: 'Steady', mult: 1.0, dmg: 0, desc: 'About 8 hours a day, resting often.' },
    { id: 'strenuous', name: 'Strenuous', mult: 1.5, dmg: 3, desc: 'Dawn to dusk, short rests.' },
    { id: 'grueling', name: 'Grueling', mult: 2.0, dmg: 6, desc: 'Every waking hour. People wear down fast.' },
  ];
  const RATIONS = [
    { id: 'filling', name: 'Filling', lbs: 3, dmg: 0, desc: 'Full, balanced meals.' },
    { id: 'meager', name: 'Meager', lbs: 2, dmg: 3, desc: 'Small meals, people stay hungry.' },
    { id: 'barebones', name: 'Bare bones', lbs: 1, dmg: 6, desc: 'Barely enough to live on.' },
  ];

  const ILLNESSES = ['exhaustion', 'typhoid', 'cholera', 'measles', 'dysentery', 'a fever'];
  const INJURIES = ['a broken arm', 'a broken leg', 'a snakebite'];
  const SERIOUS = ['typhoid', 'cholera', 'dysentery', 'measles', 'a snakebite', 'a gunshot wound'];

  // Original flavor lines written for this remake.
  const TALK = {
    independence: [
      ['A storekeeper', 'Every family that rolls out of here thinks they packed too much. By Fort Laramie half of them wish they had packed more.'],
      ['A wagon master', 'Oxen are slow, but they eat what the trail gives them. Horses want grain you will not have.'],
      ['A schoolteacher', 'Write everything down. You will forget which week was which before you reach the mountains.'],
    ],
    kansas: [
      ['A ferryman', 'River runs high this time of year. Five dollars buys you a dry wagon.'],
      ['A traveler from Indiana', 'We tried to ford upstream and lost a barrel of flour. Measure the depth before you decide.'],
    ],
    bigblue: [
      ['An emigrant woman', 'We waited two days for the water to fall. The children caught fish the whole time.'],
      ['A scout', 'Past here the country opens up. Watch your water. Not every creek is fit to drink.'],
    ],
    kearney: [
      ['A soldier', 'The army just put this post up. We count the wagons going by and there are more every week.'],
      ['A trader', 'Prices only go up from here. Buy what you need while you can.'],
    ],
    chimney: [
      ['A young man', 'You can see that spire for two days before you reach it. Feels like it never gets closer.'],
      ['A preacher', 'Carve your name if you like. Plenty have. The rock does not seem to mind.'],
    ],
    laramie: [
      ['A clerk at the post', 'Lighten your wagon here. The climb ahead will kill oxen hauling furniture.'],
      ['A Lakota trader', 'Good buffalo country north of the river this season. Do not waste the meat.'],
    ],
    indrock: [
      ['A guide', 'Reach this rock by the Fourth of July and you will likely beat the snow. Later than that, hurry.'],
      ['A girl with a chisel', 'I wrote my whole family on the north side. Mother says it is vanity. I say it is history.'],
    ],
    southpass: [
      ['A trapper', 'Hard to believe this is the top of the continent. It is wide as a meadow.'],
      ['An emigrant', 'Cutoff saves time but there is a long dry stretch. Fill every keg you have.'],
    ],
    green: [
      ['A ferry operator', 'This river does not forgive. Deep, cold, and fast. I would not swim it.'],
      ['A mountain man', 'Ferry or wait. Those are your two smart choices.'],
    ],
    bridger: [
      ['A blacksmith', 'If your iron is cracked, now is the time. Next forge is a long way off.'],
      ['A trader', 'Folks bound for the Salt Lake split off here. You keep north.'],
    ],
    soda: [
      ['A traveler', 'The water bubbles like it was boiling but it is cold. Tastes like a bad tonic.'],
      ['A boy', 'There is a spring over there that spouts every few seconds. We call it the steamboat.'],
    ],
    hall: [
      ['A Hudson Bay man', 'Some here will tell you to turn for California. Oregon is still the better farmland.'],
      ['A Shoshone woman', 'Downriver the crossing is dangerous. My people know where it is safe.'],
    ],
    snake: [
      ['A Shoshone guide', 'Give me clothing and I will take your wagon across where the bottom is good.'],
      ['An emigrant', 'Three islands out there. The current between them is the trouble.'],
    ],
    boise: [
      ['A trader', 'The Blue Mountains are next. Steep up and steep down. Lock your wheels on the descent.'],
      ['An emigrant', 'My oxen are nearly done. I traded a rocking chair for two fresh ones.'],
    ],
    bluemtns: [
      ['A missionary', 'The Whitman place is north of here. Many trains stop for help and supplies.'],
      ['A guide', 'Timber everywhere. You will need to cut road in places.'],
    ],
    wallawalla: [
      ['A clerk', 'From here the Columbia carries you west if you can build a raft or buy a boat.'],
      ['A Cayuse man', 'Good horses here. Your oxen look tired.'],
    ],
    dalles: [
      ['A raft builder', 'The river is quicker but the rocks have taken many. Keep to the channel.'],
      ['A toll collector', 'The Barlow Road goes around Mount Hood. Rough, but it keeps you dry. Pay at the gate.'],
    ],
  };

  // ---------- Helpers ----------
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const alive = (s) => s.party.filter((p) => p.alive);

  function healthLabel(h) {
    if (h < 35) return 'good';
    if (h < 70) return 'fair';
    if (h < 105) return 'poor';
    return 'very poor';
  }

  function dateOf(s) {
    const d = new Date(Date.UTC(1848, s.startMonth, 1));
    d.setUTCDate(d.getUTCDate() + s.day);
    return d;
  }
  function dateString(s) {
    const d = dateOf(s);
    return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, 1848`;
  }

  function occupation(s) {
    return OCCUPATIONS.find((o) => o.id === s.occupation);
  }

  function priceMultiplier(s) {
    return 1 + 0.25 * s.fortsVisited;
  }

  function prices(s) {
    const m = priceMultiplier(s);
    const out = {};
    for (const k in BASE_PRICES) out[k] = Math.round(BASE_PRICES[k] * m * 100) / 100;
    return out;
  }

  function log(s, msg) {
    s.log.push({ date: dateString(s), msg });
    if (s.log.length > 200) s.log.shift();
  }

  // ---------- Setup ----------
  function newGame(opts) {
    const occ = OCCUPATIONS.find((o) => o.id === opts.occupation) || OCCUPATIONS[0];
    const seed = opts.seed != null ? opts.seed : Math.floor(Math.random() * 2 ** 31);
    const names = (opts.names || []).slice(0, 5);
    while (names.length < 5) names.push(['Jacob', 'Sarah', 'Ezra', 'Mary', 'Henry'][names.length]);
    const s = {
      seed,
      rngState: seed,
      occupation: occ.id,
      money: occ.cash,
      startMonth: START_MONTHS.includes(opts.month) ? opts.month : 3,
      day: 0,
      party: names.map((n, i) => ({ name: n || `Traveler ${i + 1}`, alive: true, ill: null, leader: i === 0 })),
      health: 0,
      oxen: 0, food: 0, clothing: 0, bullets: 0, wheel: 0, axle: 0, tongue: 0,
      pace: 'steady', rations: 'filling',
      at: 'independence',
      next: null,
      milesToNext: 0,
      segmentLength: 0,
      milesTraveled: 0,
      path: ['independence'],
      fortsVisited: 0,
      oxInjured: false,
      broken: null,
      weather: null,
      river: null,
      status: 'store', // store | landmark | travel | river | fork | dalles | won | dead
      log: [],
      deaths: [],
    };
    s.weather = rollWeather(s, rngFor(s));
    log(s, `The party leaves ${LANDMARKS.independence.name} with ${occ.name.toLowerCase()} ${s.party[0].name} in charge.`);
    return s;
  }

  // Each call advances a persisted RNG state so saves are deterministic.
  function rngFor(s) {
    const r = makeRng(s.rngState);
    s.rngState = Math.floor(r() * 2 ** 31) ^ (s.day * 2654435761);
    return r;
  }

  // ---------- Store ----------
  function buy(s, item, qty) {
    if (!(item in BASE_PRICES) || qty <= 0) return { ok: false, msg: 'Nothing to buy.' };
    const p = prices(s)[item];
    const have = s[item];
    const room = LIMITS[item] - have;
    if (room <= 0) return { ok: false, msg: `Your wagon can't hold more ${ITEM_LABEL[item]}.` };
    qty = Math.min(qty, room);
    const cost = Math.round(p * qty * 100) / 100;
    if (cost > s.money + 1e-9) return { ok: false, msg: `That costs $${cost.toFixed(2)}. You have $${s.money.toFixed(2)}.` };
    s.money = Math.round((s.money - cost) * 100) / 100;
    s[item] += qty;
    return { ok: true, msg: `Bought ${qty} ${ITEM_LABEL[item]} for $${cost.toFixed(2)}.`, qty, cost };
  }

  function sell(s, item, qty) {
    // Store buys back at half price. Used for correcting mistakes in the opening store.
    qty = Math.min(qty, s[item]);
    if (qty <= 0) return { ok: false, msg: 'Nothing to return.' };
    const refund = Math.round(prices(s)[item] * qty * (s.day === 0 && s.at === 'independence' ? 1 : 0.5) * 100) / 100;
    s[item] -= qty;
    s.money = Math.round((s.money + refund) * 100) / 100;
    return { ok: true, msg: `Returned ${qty} ${ITEM_LABEL[item]} for $${refund.toFixed(2)}.` };
  }

  // ---------- Departure / arrival ----------
  function canLeave(s) {
    if (s.oxen < 2) return 'You need at least one yoke of oxen to pull the wagon.';
    return null;
  }

  function depart(s, forkIndex) {
    const lm = LANDMARKS[s.at];
    const idx = lm.next.length > 1 ? (forkIndex || 0) : 0;
    s.next = lm.next[idx];
    s.segmentLength = lm.dist[idx];
    s.milesToNext = lm.dist[idx];
    s.status = 'travel';
    log(s, `Left ${lm.name}. ${s.milesToNext} miles to ${LANDMARKS[s.next].name}.`);
  }

  function arrive(s) {
    s.at = s.next;
    s.next = null;
    s.milesToNext = 0;
    s.path.push(s.at);
    const lm = LANDMARKS[s.at];
    log(s, `Arrived at ${lm.name}.`);
    if (lm.type === 'fort') s.fortsVisited += 1;
    if (lm.type === 'river') { s.river = rollRiver(s, rngFor(s)); s.status = 'river'; }
    else if (lm.type === 'dalles') s.status = 'dalles';
    else if (lm.type === 'end') s.status = 'won';
    else if (lm.next.length > 1) s.status = 'fork';
    else s.status = 'landmark';
  }

  // ---------- Weather ----------
  function rollWeather(s, rng) {
    const zoneId = s.next ? LANDMARKS[s.next].zone : LANDMARKS[s.at].zone;
    const zone = ZONES[zoneId];
    const m = dateOf(s).getUTCMonth();
    const temp = MONTH_TEMP[m] + zone.temp + rng.int(-12, 12);
    let label;
    if (temp < 10) label = 'very cold';
    else if (temp < 30) label = 'cold';
    else if (temp < 50) label = 'cool';
    else if (temp < 70) label = 'warm';
    else if (temp < 90) label = 'hot';
    else label = 'very hot';
    const wetChance = 0.18 * zone.rain;
    let precip = null;
    if (rng.chance(wetChance)) {
      if (temp < 32) precip = rng.chance(0.3) ? 'heavy snow' : 'snow';
      else precip = rng.chance(0.25) ? 'heavy rain' : 'rain';
    }
    return { temp, label, precip, zone: zoneId };
  }

  function weatherString(w) {
    return w.precip ? `${w.label}, ${w.precip}` : w.label;
  }

  // ---------- Health ----------
  function dailyHealth(s, rng, resting) {
    const living = alive(s);
    const pace = PACES.find((p) => p.id === s.pace);
    const rat = RATIONS.find((r) => r.id === s.rations);
    s.health *= resting ? 0.82 : 0.9;
    if (!resting) s.health += pace.dmg;
    if (s.food <= 0) s.health += 6;
    else s.health += rat.dmg;
    const w = s.weather;
    if (w.temp < 32) {
      const need = living.length * (w.temp < 10 ? 3 : 2);
      const short = clamp(need - s.clothing, 0, need);
      s.health += need ? (short / need) * (w.temp < 10 ? 6 : 3) : 0;
    }
    if (w.temp >= 90) s.health += 1;
    if (w.precip === 'heavy rain' || w.precip === 'heavy snow') s.health += 1;
    s.health += living.filter((p) => p.ill).length;
    s.health = clamp(s.health, 0, 200);
  }

  function processIllness(s, rng, resting) {
    const events = [];
    const doctor = s.occupation === 'doctor';
    for (const p of alive(s)) {
      if (!p.ill) continue;
      p.ill.days -= 1;
      let recover = 0.08 + (resting ? 0.06 : 0) + (doctor ? 0.06 : 0) + (s.health < 35 ? 0.04 : 0);
      if (p.ill.days <= 0) recover += 0.25;
      if (rng.chance(recover)) {
        events.push({ type: 'recover', msg: `${p.name} is well again.` });
        p.ill = null;
        continue;
      }
      const serious = SERIOUS.includes(p.ill.what);
      let die = serious ? 0.007 : 0.0015;
      if (s.health > 35) die += (s.health - 35) * 0.0007;
      if (s.health >= 105) die *= 2;
      if (doctor) die *= 0.7;
      if (resting) die *= 0.6;
      if (rng.chance(die)) {
        const what = p.ill.what;
        killMember(s, p, what);
        events.push({ type: 'death', msg: `${p.name} has died of ${what}.`, name: p.name });
      }
    }
    // Starvation or ruin can take healthy people too.
    if (s.health >= 140) {
      const victims = alive(s);
      if (victims.length && rng.chance(0.06)) {
        const p = rng.pick(victims);
        const cause = s.food <= 0 ? 'starvation' : 'exhaustion';
        killMember(s, p, cause);
        events.push({ type: 'death', msg: `${p.name} has died of ${cause}.`, name: p.name });
      }
    }
    return events;
  }

  function killMember(s, p, cause) {
    p.alive = false;
    s.deaths.push({ name: p.name, cause: cause || 'unknown causes', date: dateString(s), where: s.next ? `near ${LANDMARKS[s.next].name}` : LANDMARKS[s.at].name });
    log(s, `${p.name} died of ${cause}.`);
    if (p.leader || alive(s).length === 0) s.status = 'dead';
  }

  // ---------- Random events ----------
  function randomEvent(s, rng) {
    const living = alive(s);
    const w = s.weather;
    const zone = w.zone;
    const m = dateOf(s).getUTCMonth();
    const farmer = false; // no occupation perks in the 1985 rules
    const ill = 0.022 + s.health * 0.001;

    const table = [
      { p: ill * (s.occupation === 'doctor' ? 0.7 : 1), fn: () => {
        const cands = living.filter((p) => !p.ill);
        if (!cands.length) return null;
        const p = rng.pick(cands);
        const what = rng.pick(ILLNESSES);
        p.ill = { what, days: rng.int(6, 14) };
        return { type: 'ill', msg: `${p.name} has ${what}.` };
      } },
      { p: 0.005, fn: () => {
        const cands = living.filter((p) => !p.ill);
        if (!cands.length) return null;
        const p = rng.pick(cands);
        const what = rng.pick(INJURIES);
        p.ill = { what, days: rng.int(8, 16) };
        return { type: 'ill', msg: `${p.name} has ${what}.` };
      } },
      { p: (farmer ? 0.005 : 0.012), fn: () => {
        if (s.oxen < 1 || s.oxInjured) return null;
        s.oxInjured = true;
        return { type: 'bad', msg: 'One of the oxen is injured. You will travel slower.' };
      } },
      { p: (farmer ? 0.003 : 0.007) + (s.health > 70 ? 0.004 : 0), fn: () => {
        if (s.oxen < 1) return null;
        s.oxen -= 1;
        return { type: 'bad', msg: s.oxen > 0 ? 'One of your oxen has died.' : 'Your last ox has died. You cannot move.' };
      } },
      { p: 0.013, fn: () => {
        const part = rng.pick(['wheel', 'axle', 'tongue']);
        s.broken = part;
        return { type: 'broken', msg: `A wagon ${part} broke.`, part };
      } },
      { p: (zone === 'plains' || zone === 'highplains' || zone === 'snakeplain') ? 0.004 : 0.0015, fn: () => {
        return { type: 'riders', msg: 'Riders ahead. They look hostile.' };
      } },
      { p: 0.007, fn: () => {
        const opts = ['food', 'clothing', 'bullets', 'oxen'].filter((k) => s[k] > 0);
        if (!opts.length) return null;
        const k = rng.pick(opts);
        const amt = Math.min(s[k], k === 'food' ? Math.ceil(s.food * rng.int(10, 30) / 100) : k === 'oxen' ? 1 : Math.max(1, Math.ceil(s[k] * 0.25)));
        s[k] -= amt;
        return { type: 'bad', msg: `A thief came in the night and stole ${amt} ${ITEM_LABEL[k]}.` };
      } },
      { p: 0.006, fn: () => { const d = rng.int(1, 4); s.lostDays = d; return { type: 'delay', msg: `Lost trail. You lose ${d} day${d > 1 ? 's' : ''}.`, days: d }; } },
      { p: ZONES[zone].speed < 1 ? 0.012 : 0.004, fn: () => { s.slowToday = 0.5; return { type: 'delay', msg: 'Rough trail. Slow going today.' }; } },
      { p: 0.005, fn: () => { s.lostDays = 1; return { type: 'delay', msg: 'Heavy fog. You lose a day.', days: 1 }; } },
      { p: (zone === 'plains' || zone === 'highplains') && m >= 4 && m <= 7 ? 0.008 : 0, fn: () => {
        s.lostDays = 1;
        const lost = Math.min(s.food, rng.int(5, 30));
        s.food -= lost;
        return { type: 'delay', msg: `Severe thunderstorm. You lose a day${lost ? ` and ${lost} pounds of food` : ''}.`, days: 1 };
      } },
      { p: (zone === 'plains' || zone === 'highplains') && m >= 5 && m <= 7 ? 0.004 : 0, fn: () => {
        s.lostDays = 1;
        return { type: 'delay', msg: 'Hail storm. You lose a day.', days: 1 };
      } },
      { p: w.temp < 25 ? 0.05 : 0, fn: () => {
        const d = rng.int(1, 3); s.lostDays = d; s.health += 4;
        return { type: 'delay', msg: `Blizzard. You lose ${d} day${d > 1 ? 's' : ''}.`, days: d };
      } },
      { p: 0.007, fn: () => { s.health += 6; return { type: 'bad', msg: 'Bad water.' }; } },
      { p: zone === 'highdesert' || zone === 'snakeplain' ? 0.012 : 0.003, fn: () => { s.health += 5; return { type: 'bad', msg: 'No water.' }; } },
      { p: zone !== 'plains' && m >= 6 ? 0.008 : 0.003, fn: () => { s.health += 2; if (rng.chance(0.25) && s.oxen > 0) { s.oxen -= 1; return { type: 'bad', msg: 'Inadequate grass. An ox wandered off looking for forage.' }; } return { type: 'bad', msg: 'Inadequate grass for the oxen.' }; } },
      { p: 0.003, fn: () => {
        const k = rng.pick(['food', 'clothing', 'bullets']);
        const amt = k === 'food' ? Math.min(s.food, rng.int(20, 80)) : Math.min(s[k], rng.int(1, 3));
        if (!amt) return null;
        s[k] -= amt;
        return { type: 'bad', msg: `A fire in the wagon. You lose ${amt} ${ITEM_LABEL[k]}.` };
      } },
      { p: m >= 4 && m <= 8 && ZONES[zone].rain > 0.5 ? 0.012 : 0, fn: () => {
        const amt = rng.int(10, 40); s.food = Math.min(LIMITS.food, s.food + amt);
        return { type: 'good', msg: `You find wild fruit. +${amt} pounds of food.` };
      } },
      { p: 0.006, fn: () => {
        const gains = [];
        const k = rng.pick(['food', 'clothing', 'bullets', 'wheel', 'axle', 'tongue', 'oxen']);
        const amt = k === 'food' ? rng.int(20, 100) : k === 'oxen' ? (rng.chance(0.5) ? 1 : 0) : rng.int(1, 3);
        if (!amt) return { type: 'good', msg: 'You find an abandoned wagon, but it has nothing useful.' };
        s[k] = Math.min(LIMITS[k], s[k] + amt); gains.push(`${amt} ${ITEM_LABEL[k]}`);
        return { type: 'good', msg: `You find an abandoned wagon with ${gains.join(', ')}.` };
      } },
      { p: s.broken ? 0 : 0.003, fn: () => { s.health = Math.max(0, s.health - 10); return { type: 'good', msg: 'A passing family shares a hot meal and news from home. Spirits lift.' }; } },
    ];
    for (const e of table) {
      if (e.p > 0 && rng.chance(e.p)) {
        const r = e.fn();
        if (r) { log(s, r.msg); return r; }
      }
    }
    return null;
  }

  // ---------- Travel ----------
  function speed(s) {
    if (s.oxen <= 0) return 0;
    const pace = PACES.find((p) => p.id === s.pace);
    const zone = ZONES[LANDMARKS[s.next].zone];
    let oxFactor = Math.min(1, s.oxen / 6);
    if (s.oxInjured) oxFactor *= 0.75;
    let weatherFactor = 1;
    if (s.weather.precip === 'heavy rain') weatherFactor = 0.7;
    if (s.weather.precip === 'snow') weatherFactor = 0.7;
    if (s.weather.precip === 'heavy snow') weatherFactor = 0.4;
    // Sick people slow the wagon.
    const sick = alive(s).filter((p) => p.ill).length;
    const sickFactor = 1 - 0.06 * sick;
    return 20 * pace.mult * oxFactor * zone.speed * weatherFactor * sickFactor;
  }

  function eatOneDay(s) {
    const rat = RATIONS.find((r) => r.id === s.rations);
    s.food = Math.max(0, s.food - rat.lbs * alive(s).length);
  }

  function travelDay(s) {
    const out = { events: [], arrived: false, miles: 0 };
    if (s.status !== 'travel') return out;
    if (s.broken) { out.events.push({ type: 'blocked', msg: `You can't travel with a broken ${s.broken}.` }); return out; }
    if (s.oxen <= 0) { out.events.push({ type: 'blocked', msg: 'You have no oxen to pull the wagon.' }); return out; }
    const rng = rngFor(s);
    s.day += 1;
    s.weather = rollWeather(s, rng);
    s.slowToday = 1; s.lostDays = 0;
    eatOneDay(s);
    dailyHealth(s, rng, false);
    const ev = randomEvent(s, rng);
    if (ev) out.events.push(ev);
    for (const e of processIllness(s, rng, false)) out.events.push(e);
    if (s.status === 'dead') return out;
    if (s.lostDays) {
      // Extra lost days consume food and time but no miles.
      for (let i = 1; i < s.lostDays; i++) { s.day += 1; eatOneDay(s); dailyHealth(s, rng, true); }
    } else if (!s.broken) {
      const miles = Math.max(1, Math.round(speed(s) * s.slowToday));
      const step = Math.min(miles, s.milesToNext);
      s.milesToNext -= step;
      s.milesTraveled += step;
      out.miles = step;
      if (s.milesToNext <= 0) { arrive(s); out.arrived = true; }
    }
    if (s.food <= 0 && !out.events.some((e) => e.type === 'nofood')) out.events.push({ type: 'nofood', msg: 'You have run out of food.' });
    return out;
  }

  function rest(s, days) {
    const rng = rngFor(s);
    const events = [];
    const atLandmark = s.status !== 'travel';
    for (let i = 0; i < days && s.status !== 'dead'; i++) {
      s.day += 1;
      s.weather = rollWeather(s, rng);
      eatOneDay(s);
      dailyHealth(s, rng, true);
      if (atLandmark) s.health *= 0.9;
      if (s.oxInjured && rng.chance(0.3)) { s.oxInjured = false; events.push({ type: 'recover', msg: 'The injured ox has recovered.' }); }
      for (const e of processIllness(s, rng, true)) events.push(e);
    }
    log(s, `Rested ${days} day${days > 1 ? 's' : ''}.`);
    return events;
  }

  // ---------- Broken parts ----------
  function repair(s) {
    if (!s.broken) return { ok: false, msg: 'Nothing is broken.' };
    const rng = rngFor(s);
    const skilled = false;
    s.day += 1; eatOneDay(s); dailyHealth(s, rng, true);
    if (rng.chance(skilled ? 0.6 : 0.3)) {
      const part = s.broken; s.broken = null;
      log(s, `Repaired the ${part}.`);
      return { ok: true, msg: `You spent a day and repaired the ${part}.` };
    }
    return { ok: false, msg: `You spent a day trying, but the ${s.broken} can't be fixed.` };
  }

  function replacePart(s) {
    if (!s.broken) return { ok: false, msg: 'Nothing is broken.' };
    const part = s.broken;
    if (s[part] <= 0) return { ok: false, msg: `You have no spare ${part}.` };
    s[part] -= 1; s.broken = null;
    log(s, `Replaced the broken ${part}.`);
    return { ok: true, msg: `You replaced the broken ${part} with a spare.` };
  }

  // ---------- Rivers ----------
  function rollRiver(s, rng) {
    const id = s.at;
    const m = dateOf(s).getUTCMonth();
    const spring = m >= 3 && m <= 5;
    const base = { kansas: [620, 2.0, 5.5], bigblue: [200, 1.5, 4.5], green: [400, 4.5, 12], snake: [1000, 4.0, 10] }[id] || [300, 2, 5];
    let depth = base[1] + rng() * (base[2] - base[1]);
    if (spring) depth *= 1.15; else if (m >= 7) depth *= 0.85;
    depth = Math.round(depth * 10) / 10;
    const width = Math.round(base[0] * (0.85 + rng() * 0.3));
    const swift = spring && rng.chance(0.5);
    return { width, depth, swift, ferryWait: rng.int(1, 5) };
  }

  function riverWait(s) {
    const events = rest(s, 1);
    const r = s.river; const rng = rngFor(s);
    r.depth = Math.max(1, Math.round((r.depth + (rng() - 0.55) * 0.8) * 10) / 10);
    r.swift = rng.chance(r.swift ? 0.6 : 0.2);
    return events;
  }

  function crossRiver(s, method) {
    const lm = LANDMARKS[s.at];
    const r = s.river;
    const rng = rngFor(s);
    const res = { ok: true, msgs: [] };
    if (method === 'ferry') {
      if (!lm.ferry) return { ok: false, msgs: ['There is no ferry here.'] };
      if (s.money < lm.ferry) return { ok: false, msgs: [`The ferry costs $${lm.ferry}. You don't have enough money.`] };
      s.money -= lm.ferry;
      for (let i = 0; i < r.ferryWait; i++) { s.day += 1; eatOneDay(s); dailyHealth(s, rng, true); }
      res.msgs.push(`You waited ${r.ferryWait} day${r.ferryWait > 1 ? 's' : ''} for the ferry.`);
      if (rng.chance(0.03)) res.msgs.push(loseSupplies(s, rng, 0.1, 'The ferry scraped a sandbar. Some supplies went overboard.'));
      else res.msgs.push('The ferry got your party and wagon safely across.');
    } else if (method === 'guide') {
      if (!lm.guide) return { ok: false, msgs: ['No guide is offering help here.'] };
      if (s.clothing < 3) return { ok: false, msgs: ['The guide asks for 3 sets of clothing. You don\'t have enough.'] };
      s.clothing -= 3;
      s.day += 1; eatOneDay(s);
      if (rng.chance(0.03)) res.msgs.push(loseSupplies(s, rng, 0.08, 'Even the guide could not keep everything dry.'));
      else res.msgs.push('The guide led your wagon safely across.');
    } else if (method === 'ford') {
      s.day += 1; eatOneDay(s);
      if (r.depth < 2.5) {
        res.msgs.push(rng.chance(0.08) ? (s.lostDays = 1, s.day += 1, 'The wagon got stuck in mud. You lose a day.') : 'You forded the river safely.');
      } else if (r.depth < 3.0) {
        if (rng.chance(0.4)) res.msgs.push(loseSupplies(s, rng, 0.2, 'Water swamped the wagon bed. Some supplies were lost.'));
        else res.msgs.push('The water was high but you made it across.');
      } else {
        res.msgs.push(disaster(s, rng, Math.min(0.95, 0.45 + (r.depth - 3) * 0.12)));
      }
    } else if (method === 'caulk') {
      s.day += 1; eatOneDay(s);
      let risk = 0.12 + (r.swift ? 0.18 : 0) + (r.depth > 6 ? 0.08 : 0);
      if (r.depth < 1.5) { res.msgs.push('The river is too shallow to float. You drag the wagon across.'); risk = 0.02; }
      if (rng.chance(risk)) res.msgs.push(disaster(s, rng, 0.5));
      else res.msgs.push('You caulked the wagon and floated it across.');
    } else {
      return { ok: false, msgs: ['Unknown method.'] };
    }
    for (const m of res.msgs) log(s, m);
    s.river = null;
    s.status = s.status === 'dead' ? 'dead' : 'landmark';
    return res;
  }

  function loseSupplies(s, rng, frac, prefix) {
    const lost = [];
    for (const k of ['food', 'clothing', 'bullets', 'wheel', 'axle', 'tongue']) {
      if (s[k] > 0 && rng.chance(0.6)) {
        const amt = Math.max(1, Math.round(s[k] * frac * (0.5 + rng())));
        const take = Math.min(s[k], amt);
        s[k] -= take; lost.push(`${take} ${ITEM_LABEL[k]}`);
      }
    }
    if (rng.chance(frac) && s.oxen > 0) { s.oxen -= 1; lost.push('1 ox'); }
    return lost.length ? `${prefix} Lost: ${lost.join(', ')}.` : prefix.replace(/Some supplies.*$/, 'Nothing important was lost.');
  }

  function disaster(s, rng, severity) {
    let msg = loseSupplies(s, rng, 0.35 * severity + 0.1, 'The wagon tipped over!');
    if (rng.chance(0.35 * severity)) {
      const cands = alive(s).filter((p) => !p.leader);
      if (cands.length) {
        const p = rng.pick(cands);
        killMember(s, p, 'drowning');
        msg += ` ${p.name} drowned.`;
      }
    }
    return msg;
  }

  // ---------- Hunting ----------
  const HUNT_ANIMALS = {
    plains: ['bison', 'deer', 'rabbit', 'squirrel', 'antelope'],
    highplains: ['bison', 'antelope', 'rabbit', 'deer'],
    rockies: ['elk', 'deer', 'bear', 'squirrel', 'rabbit'],
    highdesert: ['antelope', 'rabbit', 'deer'],
    snakeplain: ['rabbit', 'antelope', 'deer', 'bear'],
    cascades: ['deer', 'elk', 'bear', 'squirrel'],
  };
  const ANIMAL_MEAT = { bison: 400, elk: 300, bear: 200, deer: 80, antelope: 60, rabbit: 4, squirrel: 2 };

  function huntZone(s) { return s.next ? LANDMARKS[s.next].zone : LANDMARKS[s.at].zone; }

  function finishHunt(s, bulletsFired, kills) {
    const rng = rngFor(s);
    s.bullets = Math.max(0, s.bullets - Math.ceil(bulletsFired / 20 * 100) / 100);
    s.bullets = Math.round(s.bullets * 100) / 100;
    const shot = kills.reduce((a, k) => a + (ANIMAL_MEAT[k] || 0), 0);
    const carry = Math.min(100, shot); // 100 lb cap per hunt
    const room = LIMITS.food - s.food;
    const kept = Math.min(carry, room);
    s.food += kept;
    s.day += 1; eatOneDay(s); dailyHealth(s, rng, true);
    let msg;
    if (!shot) msg = 'You came back empty-handed.';
    else if (kept < shot) msg = `You shot ${shot} pounds of meat but could only carry ${kept} pounds back to the wagon.`;
    else msg = `You shot ${shot} pounds of meat and brought it all back.`;
    log(s, msg);
    return { shot, kept, msg };
  }

  // ---------- Trading ----------
  function tradeOffer(s) {
    const rng = rngFor(s);
    s.day += 1; eatOneDay(s);
    const items = ['oxen', 'food', 'clothing', 'bullets', 'wheel', 'axle', 'tongue'];
    const qty = { oxen: [1, 2], food: [40, 150], clothing: [1, 4], bullets: [1, 5], wheel: [1, 1], axle: [1, 1], tongue: [1, 1] };
    // If stuck with a broken part, travelers are likelier to offer that part.
    let get = s.broken && s[s.broken] === 0 && rng.chance(0.5) ? s.broken : rng.pick(items);
    const giveable = items.filter((k) => k !== get && s[k] > 0);
    if (!giveable.length) return null;
    const give = rng.pick(giveable);
    const offer = {
      get: { item: get, qty: rng.int(...qty[get]) },
      give: { item: give, qty: rng.int(...qty[give]) },
    };
    return offer;
  }

  function acceptTrade(s, offer) {
    if (s[offer.give.item] < offer.give.qty) return { ok: false, msg: `You don't have ${offer.give.qty} ${ITEM_LABEL[offer.give.item]}.` };
    s[offer.give.item] -= offer.give.qty;
    s[offer.get.item] = Math.min(LIMITS[offer.get.item], s[offer.get.item] + offer.get.qty);
    const msg = `Traded ${offer.give.qty} ${ITEM_LABEL[offer.give.item]} for ${offer.get.qty} ${ITEM_LABEL[offer.get.item]}.`;
    log(s, msg);
    return { ok: true, msg };
  }

  // ---------- The Dalles ----------
  const BARLOW_TOLL = 30;
  function takeBarlow(s) {
    if (s.money < BARLOW_TOLL) return { ok: false, msg: `The toll is $${BARLOW_TOLL}. You can't afford it.` };
    s.money -= BARLOW_TOLL;
    const rng = rngFor(s);
    const msgs = [`You paid the $${BARLOW_TOLL} toll and took the Barlow Road around Mount Hood.`];
    const days = 9 + rng.int(0, 4);
    for (let i = 0; i < days && s.status !== 'dead'; i++) {
      s.day += 1; s.weather = rollWeather(s, rng); eatOneDay(s); dailyHealth(s, rng, false);
      if (rng.chance(0.08)) { const r = randomEvent(s, rng); if (r && r.type !== 'broken') msgs.push(r.msg); else s.broken = null; }
      for (const e of processIllness(s, rng, false)) msgs.push(e.msg);
    }
    msgs.push(`After ${days} hard days the road came down into the valley.`);
    s.milesTraveled += LANDMARKS.dalles.dist[0];
    if (s.status !== 'dead') { s.next = 'willamette'; arrive(s); }
    return { ok: true, msgs };
  }

  function finishRaft(s, hits) {
    const rng = rngFor(s);
    const msgs = [];
    s.day += 4; for (let i = 0; i < 4; i++) eatOneDay(s);
    s.milesTraveled += LANDMARKS.dalles.dist[0];
    if (hits === 0) msgs.push('You guided the raft down the Columbia without a scratch.');
    for (let i = 0; i < hits && s.status !== 'dead'; i++) {
      if (rng.chance(0.3)) {
        const cands = alive(s).filter((p) => !p.leader);
        if (cands.length) { const p = rng.pick(cands); killMember(s, p, 'drowning'); msgs.push(`The raft hit a rock. ${p.name} was swept away and drowned.`); continue; }
      }
      msgs.push(loseSupplies(s, rng, 0.25, 'The raft hit a rock.'));
    }
    if (s.status !== 'dead') { s.next = 'willamette'; arrive(s); }
    return { ok: true, msgs };
  }

  // ---------- Riders (typed BANG shootout, from the 1978 text game) ----------
  // ms: reaction time to type BANG correctly, or Infinity if mistyped / too slow.
  function resolveRiders(s, ms) {
    const rng = rngFor(s);
    const msgs = [];
    const used = Math.min(s.bullets, 0.5);
    s.bullets = Math.round((s.bullets - used) * 100) / 100;
    if (s.bullets <= 0 && used === 0) ms = Infinity;
    if (ms < 1500) msgs.push('Nice shooting. The riders turned and ran.');
    else if (ms < 3500) {
      msgs.push('Slow shooting, but you drove them off.');
      if (rng.chance(0.5) && s.food > 0) { const k = Math.min(s.food, rng.int(20, 60)); s.food -= k; msgs.push(`They got away with ${k} pounds of food.`); }
    } else {
      msgs.push(ms === Infinity ? 'Your shot went wild.' : 'Too slow.');
      const r = loseSupplies(s, rng, 0.2, 'The riders raided the wagon.');
      msgs.push(r);
      if (rng.chance(0.15)) {
        const cands = alive(s).filter((p) => !p.leader && !p.ill);
        if (cands.length) { const p = rng.pick(cands); p.ill = { what: 'a gunshot wound', days: rng.int(8, 14) }; msgs.push(`${p.name} was shot.`); }
      }
    }
    for (const m of msgs) log(s, m);
    return { msgs };
  }

  // ---------- Score ----------
  function score(s) {
    const living = alive(s);
    const hl = healthLabel(s.health);
    const perPerson = { good: 500, fair: 400, poor: 300, 'very poor': 200 }[hl];
    const rows = [
      ['Travelers in ' + hl + ' health', living.length, living.length * perPerson],
      ['Wagon', 1, 50],
      ['Oxen', s.oxen, s.oxen * 4],
      ['Spare parts', s.wheel + s.axle + s.tongue, (s.wheel + s.axle + s.tongue) * 2],
      ['Sets of clothing', s.clothing, s.clothing * 2],
      ['Bullets', Math.floor(s.bullets * 20), Math.floor(s.bullets * 20 / 50)],
      ['Pounds of food', Math.floor(s.food), Math.floor(s.food / 25)],
      ['Cash', '$' + Math.floor(s.money), Math.floor(s.money / 5)],
    ];
    const raw = rows.reduce((a, r) => a + r[2], 0);
    const bonus = occupation(s).bonus;
    return { rows, raw, bonus, total: Math.round(raw * bonus) };
  }

  const OT = {
    makeRng, OCCUPATIONS, MONTHS, START_MONTHS, BASE_PRICES, LIMITS, ITEM_LABEL, LANDMARKS, ZONES, PACES, RATIONS, TALK,
    HUNT_ANIMALS, ANIMAL_MEAT, BARLOW_TOLL,
    newGame, buy, sell, prices, priceMultiplier, canLeave, depart, travelDay, rest, repair, replacePart,
    riverWait, crossRiver, finishHunt, huntZone, tradeOffer, acceptTrade, takeBarlow, finishRaft, score, resolveRiders,

  else root.OT = OT;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*
 * Procedural pixel art. Every image in the game is drawn here in code.
 * Scenes are composed in color on a 280x160 canvas (Apple II hi-res width),
 * then reduced to 1-bit green phosphor with a 4x4 ordered dither,
 * the same way a monochrome monitor showed hi-res graphics.
 */
(function (root) {
  'use strict';
  const W = 280, H = 160;

  // A fixed 256-color-era palette, picked for this remake.
  const P = {
    ink: '#1b1a24', white: '#fbf8ef',
    skyTop: '#10141e', skyMid: '#2a3446', skyLow: '#465570',
    duskTop: '#3b3f7a', duskLow: '#e79c6b',
    stormTop: '#4b5568', stormLow: '#8d97a6',
    snowSky: '#aab6c8',
    grass1: '#6fa648', grass2: '#4f8a35', grass3: '#3a6b29',
    dry1: '#c9b06a', dry2: '#a88f4f', dry3: '#7d6a3a',
    sage: '#8f9f6a',
    rock1: '#a0644a', rock2: '#7c4936', rock3: '#5a3427',
    mtnFar: '#7f8fb0', mtnMid: '#5f6f8f', mtnNear: '#4a5770', snow: '#eef3f8',
    pine1: '#2f5a3a', pine2: '#244a30',
    water1: '#3d78b8', water2: '#2e5f99', water3: '#7fb2e0', foam: '#d8ecfa',
    canvas: '#efe6cc', canvasShade: '#cfc29f', wood: '#8a5a32', woodDark: '#5c3a1f',
    iron: '#3a3a44', ox: '#7a4a2c', oxDark: '#4e2e1a', horn: '#e8dcc0',
    fort: '#9a7048', fortDark: '#6b4a2c', flag: '#c8383a',
    sun: '#ffe58a', cloud: '#ffffff', cloudShade: '#dde6f0',
  };

  function px(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  // Deterministic noise so hills don't shimmer between frames.
  function hash(n) { n = (n << 13) ^ n; return 1.0 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824.0; }
  function ridge(x, seed, amp, freq) {
    const a = x * freq;
    const i = Math.floor(a), f = a - i;
    const s = f * f * (3 - 2 * f);
    return (hash(i + seed) * (1 - s) + hash(i + 1 + seed) * s) * amp;
  }

  // Sky drawn in hard color bands, like an 8-bit palette gradient.
  function bandedSky(ctx, top, low, horizon) {
    const steps = 8;
    const parse = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const a = parse(top), b = parse(low);
    for (let i = 0; i < steps; i++) {
      const t = i / (steps - 1);
      const c = a.map((v, k) => Math.round(v + (b[k] - v) * t));
      const y0 = Math.floor((horizon * i) / steps), y1 = Math.floor((horizon * (i + 1)) / steps);
      px(ctx, 0, y0, W, y1 - y0, `rgb(${c[0]},${c[1]},${c[2]})`);
    }
  }

  function cloud(ctx, x, y, s) {
    px(ctx, x, y + 4 * s, 26 * s, 5 * s, P.cloudShade);
    px(ctx, x + 2 * s, y + 2 * s, 22 * s, 5 * s, P.cloud);
    px(ctx, x + 6 * s, y, 10 * s, 4 * s, P.cloud);
  }

  function sky(ctx, weather, offset) {
    const horizon = 92;
    if (weather && /snow/.test(weather.precip || '')) bandedSky(ctx, P.snowSky, '#dfe6ee', horizon);
    else if (weather && /rain/.test(weather.precip || '')) bandedSky(ctx, P.stormTop, P.stormLow, horizon);
    else bandedSky(ctx, P.skyTop, P.skyLow, horizon);
    if (!weather || !weather.precip) {
      px(ctx, 232, 14, 14, 14, P.sun); px(ctx, 229, 17, 20, 8, P.sun);
    }
    const o = (offset || 0) * 0.05;
    cloud(ctx, ((40 - o) % 380 + 380) % 380 - 40, 18, 1);
    cloud(ctx, ((190 - o) % 380 + 380) % 380 - 40, 30, 1);
  }

  function mountains(ctx, seed, base, amp, color, capColor, offset, freq) {
    ctx.fillStyle = color;
    for (let x = 0; x < W; x++) {
      const h = Math.abs(ridge(x + offset, seed, amp, freq || 0.02)) + amp * 0.2;
      ctx.fillRect(x, Math.round(base - h), 1, Math.round(h) + 1);
      if (capColor && h > amp * 0.85) ctx.fillStyle = capColor, ctx.fillRect(x, Math.round(base - h), 1, 3), ctx.fillStyle = color;
    }
  }

  function zonePalette(zone) {
    switch (zone) {
      case 'plains': return { g: [P.grass1, P.grass2, P.grass3], hills: null };
      case 'highplains': return { g: [P.dry1, P.grass1, P.grass2], hills: P.dry2 };
      case 'rockies': return { g: [P.sage, P.dry2, P.grass3], hills: P.mtnMid };
      case 'highdesert': return { g: [P.dry1, P.dry2, P.dry3], hills: P.rock2 };
      case 'snakeplain': return { g: [P.dry1, P.sage, P.dry3], hills: P.rock3 };
      case 'cascades': return { g: [P.grass2, P.grass3, P.pine2], hills: P.mtnNear };
      default: return { g: [P.grass1, P.grass2, P.grass3], hills: null };
    }
  }

  function ground(ctx, zone, offset, snowy) {
    const zp = zonePalette(zone);
    const g = snowy ? [P.snow, '#dbe4ee', '#c4cfdc'] : zp.g;
    px(ctx, 0, 92, W, 68, g[0]);
    px(ctx, 0, 112, W, 48, g[1]);
    px(ctx, 0, 138, W, 22, g[2]);
    // Tufts and stones scroll at foreground speed.
    for (let i = 0; i < 26; i++) {
      const x = ((i * 53 - offset) % (W + 20) + W + 20) % (W + 20) - 10;
      const y = 116 + ((i * 37) % 40);
      px(ctx, x, y, 3, 1, g[2]); px(ctx, x + 1, y - 1, 1, 1, g[2]);
    }
    // Trail ruts.
    px(ctx, 0, 127, W, 2, snowy ? '#b9c4d2' : P.dry3);
    px(ctx, 0, 133, W, 2, snowy ? '#b9c4d2' : P.dry3);
  }

  function pine(ctx, x, y, s) {
    px(ctx, x + 3 * s, y + 12 * s, 2 * s, 3 * s, P.woodDark);
    for (let i = 0; i < 4; i++) px(ctx, x + (3 - i) * s, y + i * 3 * s, (2 + i * 2) * s, 3 * s, i % 2 ? P.pine1 : P.pine2);
  }

  function backdrop(ctx, zone, offset) {
    const zp = zonePalette(zone);
    if (zone === 'rockies' || zone === 'cascades') {
      mountains(ctx, 11, 92, 46, P.mtnFar, P.snow, offset * 0.1, 0.03);
      mountains(ctx, 29, 94, 26, zp.hills, null, offset * 0.25, 0.04);
    } else if (zone === 'highplains' || zone === 'highdesert' || zone === 'snakeplain') {
      mountains(ctx, 7, 92, 14, P.mtnFar, null, offset * 0.1, 0.015);
      mountains(ctx, 17, 94, 8, zp.hills, null, offset * 0.25, 0.05);
    } else {
      mountains(ctx, 3, 93, 6, P.grass2, null, offset * 0.2, 0.02);
    }
    if (zone === 'cascades' || zone === 'rockies') {
      for (let i = 0; i < 9; i++) {
        const x = ((i * 41 - offset * 0.5) % (W + 30) + W + 30) % (W + 30) - 15;
        pine(ctx, x, 82 + (i % 3) * 4, 1);
      }
    }
  }

  function precipitation(ctx, weather, t) {
    if (!weather || !weather.precip) return;
    const snow = /snow/.test(weather.precip);
    const heavy = /heavy/.test(weather.precip);
    const n = heavy ? 140 : 70;
    for (let i = 0; i < n; i++) {
      const x = (i * 97 + t * (snow ? 0.4 : 1.5) * (i % 3 + 1)) % W;
      const y = (i * 61 + t * (snow ? 0.6 : 4)) % H;
      if (snow) px(ctx, x, y, 1, 1, P.white);
      else px(ctx, x, y, 1, 3, '#c9d7ea');
    }
  }

  // ---------- Wagon and oxen ----------
  function wheel(ctx, cx, cy, r, frame) {
    ctx.fillStyle = P.woodDark;
    for (let a = 0; a < Math.PI * 2; a += 0.15) ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
    const rot = frame * 0.25;
    for (let k = 0; k < 4; k++) {
      const a = rot + (k * Math.PI) / 4;
      for (let d = -r + 1; d < r; d++) px(ctx, cx + Math.cos(a) * d, cy + Math.sin(a) * d, 1, 1, P.wood);
    }
    px(ctx, cx - 1, cy - 1, 2, 2, P.iron);
  }

  function wagon(ctx, x, y, frame) {
    const bob = frame % 8 < 4 ? 0 : 1;
    // bed
    px(ctx, x, y - 10 + bob, 34, 7, P.wood);
    px(ctx, x, y - 4 + bob, 34, 1, P.woodDark);
    // bonnet hoops
    px(ctx, x + 2, y - 24 + bob, 30, 14, P.canvas);
    px(ctx, x + 4, y - 27 + bob, 26, 3, P.canvas);
    px(ctx, x + 2, y - 12 + bob, 30, 2, P.canvasShade);
    for (let i = 0; i < 3; i++) px(ctx, x + 8 + i * 9, y - 26 + bob, 1, 14, P.canvasShade);
    // tongue
    px(ctx, x + 34, y - 6 + bob, 12, 1, P.woodDark);
    wheel(ctx, x + 7, y, 6, frame);
    wheel(ctx, x + 27, y, 6, frame);
  }

  function ox(ctx, x, y, frame) {
    const step = frame % 8 < 4;
    px(ctx, x, y - 10, 16, 7, P.ox);
    px(ctx, x + 1, y - 4, 14, 1, P.oxDark);
    px(ctx, x + 14, y - 12, 6, 6, P.ox);
    px(ctx, x + 19, y - 9, 2, 2, P.oxDark);
    px(ctx, x + 14, y - 14, 1, 2, P.horn); px(ctx, x + 19, y - 14, 1, 2, P.horn);
    px(ctx, x - 1, y - 9, 1, 4, P.oxDark);
    const legs = step ? [1, 5, 10, 13] : [2, 4, 11, 12];
    legs.forEach((lx) => px(ctx, x + lx, y - 3, 2, 4, P.oxDark));
  }

  function team(ctx, x, y, frame, oxen) {
    wagon(ctx, x, y, frame);
    const yokes = Math.max(1, Math.min(2, Math.ceil(oxen / 2)));
    for (let i = 0; i < yokes; i++) ox(ctx, x + 46 + i * 22, y + 1, frame + i * 2);
  }

  // ---------- Landmarks ----------
  function fort(ctx, x, y) {
    px(ctx, x, y - 26, 70, 26, P.fort);
    for (let i = 0; i < 70; i += 4) px(ctx, x + i, y - 30, 3, 4, P.fort);
    for (let i = 0; i < 70; i += 4) px(ctx, x + i + 3, y - 26, 1, 26, P.fortDark);
    px(ctx, x - 6, y - 36, 14, 36, P.fortDark); px(ctx, x - 6, y - 40, 14, 4, P.fort);
    px(ctx, x + 62, y - 36, 14, 36, P.fortDark); px(ctx, x + 62, y - 40, 14, 4, P.fort);
    px(ctx, x + 28, y - 14, 14, 14, P.woodDark);
    px(ctx, x + 34, y - 56, 1, 26, P.iron);
    px(ctx, x + 35, y - 56, 10, 6, P.flag);
  }

  function chimney(ctx, x, y) {
    px(ctx, x - 30, y - 12, 80, 12, P.dry2);
    px(ctx, x - 18, y - 22, 56, 10, P.dry2);
    px(ctx, x - 6, y - 32, 32, 10, P.rock1);
    px(ctx, x + 4, y - 70, 12, 38, P.rock1);
    px(ctx, x + 6, y - 78, 8, 8, P.rock1);
    px(ctx, x + 12, y - 70, 4, 38, P.rock2);
  }

  function dome(ctx, x, y, w, h, c, shade) {
    for (let i = 0; i < w; i++) {
      const t = (i / w) * 2 - 1;
      const hh = Math.round(h * Math.sqrt(Math.max(0, 1 - t * t)));
      px(ctx, x + i, y - hh, 1, hh, i > w * 0.6 ? shade : c);
    }
  }

  function springs(ctx, x, y, t) {
    px(ctx, x, y - 6, 60, 6, P.rock1);
    px(ctx, x + 6, y - 5, 18, 3, P.water3);
    px(ctx, x + 32, y - 5, 20, 3, P.water3);
    const h = 8 + Math.round(Math.abs(Math.sin(t * 0.08)) * 14);
    px(ctx, x + 40, y - 5 - h, 3, h, P.foam);
  }

  function town(ctx, x, y) {
    const hs = [[0, 22, P.wood], [26, 30, P.fortDark], [60, 18, P.rock1], [82, 26, P.wood]];
    hs.forEach(([dx, h, c]) => {
      px(ctx, x + dx, y - h, 22, h, c);
      px(ctx, x + dx - 2, y - h - 4, 26, 4, P.woodDark);
      px(ctx, x + dx + 8, y - 10, 6, 10, P.ink);
    });
  }

  function landmark(ctx, id, type, t) {
    const gx = 170, gy = 112;
    if (type === 'fort') fort(ctx, gx, gy);
    else if (type === 'town' || type === 'dalles') town(ctx, gx - 10, gy);
    else if (id === 'chimney') chimney(ctx, gx + 30, gy);
    else if (id === 'indrock') dome(ctx, gx - 10, gy, 110, 34, P.rock1, P.rock2);
    else if (id === 'soda') springs(ctx, gx, gy, t);
    else if (id === 'southpass') { /* wide saddle: mountains already frame it */ }
    else if (id === 'bluemtns') { for (let i = 0; i < 12; i++) pine(ctx, 150 + i * 14, 84 + (i % 3) * 6, 2); }
    else if (type === 'end') {
      for (let i = 0; i < 8; i++) px(ctx, 120 + i * 24, 104, 16, 2, P.dry1);
      px(ctx, 230, 82, 26, 18, P.wood); px(ctx, 226, 76, 34, 6, P.woodDark);
    }
  }

  function riverBand(ctx, t, width) {
    const top = 100, h = 20 + Math.min(20, Math.round((width || 300) / 60));
    px(ctx, 0, top, W, h, P.water1);
    for (let i = 0; i < 30; i++) {
      const x = ((i * 37 + t * 0.7) % (W + 10)) - 5;
      px(ctx, x, top + 3 + (i * 7) % (h - 6), 6, 1, i % 2 ? P.water3 : P.water2);
    }
    px(ctx, 0, top + h, W, 2, P.dry3);
    return top + h;
  }

  // ---------- Composite scenes ----------
  function travelScene(ctx, o) {
    const zone = o.zone || 'plains';
    const snowy = o.weather && /snow/.test(o.weather.precip || '');
    sky(ctx, o.weather, o.offset);
    backdrop(ctx, zone, o.offset);
    ground(ctx, zone, o.offset, snowy);
    team(ctx, 128, 132, o.frame, o.oxen);
    precipitation(ctx, o.weather, o.frame);
  }

  function landmarkScene(ctx, o) {
    const lm = o.landmark;
    const snowy = o.weather && /snow/.test(o.weather.precip || '');
    sky(ctx, o.weather, o.frame);
    backdrop(ctx, lm.zone, 0);
    ground(ctx, lm.zone, 0, snowy);
    if (lm.type === 'river') {
      riverBand(ctx, o.frame, o.river && o.river.width);
      team(ctx, 40, 150, 0, o.oxen);
    } else {
      landmark(ctx, o.id, lm.type, o.frame);
      team(ctx, 40, 140, 0, o.oxen);
    }
    precipitation(ctx, o.weather, o.frame);
  }

  function crossingScene(ctx, o) {
    sky(ctx, null, o.frame);
    backdrop(ctx, o.zone, 0);
    ground(ctx, o.zone, 0, false);
    riverBand(ctx, o.frame, 600);
    const x = -60 + o.progress * 380;
    if (o.method === 'ferry') { px(ctx, x - 8, 116, 66, 5, P.woodDark); wagon(ctx, x, 114, 0); }
    else if (o.method === 'caulk') { wagon(ctx, x, 120 + Math.round(Math.sin(o.frame * 0.3) * 1.5), 0); }
    else if (o.method === 'guide') { px(ctx, x - 6, 118, 56, 4, P.wood); wagon(ctx, x, 116, 0); }
    else team(ctx, x, 124, o.frame, 4);
    // water line over the wheels
    for (let i = 0; i < 12; i++) px(ctx, ((i * 31 + o.frame) % W), 118, 5, 1, P.foam);
  }

  // ---------- Hunting ----------
  const ANIMAL_SHAPES = {
    bison: { w: 26, h: 16, c: '#4a3020', speed: 0.35 },
    elk: { w: 22, h: 18, c: '#8a6038', speed: 0.6 },
    bear: { w: 20, h: 14, c: '#2e2220', speed: 0.45 },
    deer: { w: 18, h: 16, c: '#a07040', speed: 0.85 },
    antelope: { w: 16, h: 14, c: '#c08848', speed: 1.1 },
    rabbit: { w: 6, h: 5, c: '#b8a890', speed: 1.4 },
    squirrel: { w: 5, h: 4, c: '#8a6a50', speed: 1.6 },
  };

  function animal(ctx, a, t) {
    const s = ANIMAL_SHAPES[a.kind];
    const x = a.x, y = a.y, w = s.w, h = s.h;
    if (a.dead) { px(ctx, x, y - 3, w, 3, s.c); return; }
    const dir = a.vx > 0 ? 1 : -1;
    px(ctx, x, y - h + h * 0.25, w * 0.8, h * 0.55, s.c);
    const hx = dir > 0 ? x + w * 0.7 : x - w * 0.15;
    px(ctx, hx, y - h, w * 0.35, h * 0.45, s.c);
    if (a.kind === 'bison') px(ctx, x + w * 0.35, y - h - 2, w * 0.4, h * 0.4, s.c);
    if (a.kind === 'elk' || a.kind === 'deer') { px(ctx, hx + 1, y - h - 4, 1, 4, '#d8c8a0'); px(ctx, hx + 4, y - h - 4, 1, 4, '#d8c8a0'); }
    const leg = Math.floor(t / 4 + a.x) % 2;
    px(ctx, x + 1 + leg, y - h * 0.25, 2, h * 0.25, s.c);
    px(ctx, x + w * 0.6 - leg, y - h * 0.25, 2, h * 0.25, s.c);
  }

  function huntScene(ctx, o) {
    sky(ctx, null, 0);
    backdrop(ctx, o.zone, 0);

  // ---------- Phosphor output ----------
  // Monochrome hi-res look: shapes get a 1-pixel outline wherever brightness changes,
  // and areas are filled with one of four fixed patterns (black, sparse dots, checker, solid).
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const GREEN = [64, 255, 96];

    for (let i = 0, j = 0; j < W * H; i += 4, j++) lumBuf[j] = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
    for (let y = 0; y < H; y++) {

        let on = false;
        if (opts.edge !== 0) {

<script>
/* Tiny square-wave sound kit. Original tunes written for this remake. */
(function (root) {
  'use strict';
  let ctx = null;
  let muted = false;

  function ensure() {
    if (ctx) return ctx;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; }
    return ctx;
  }

  function tone(freq, start, dur, type, vol) {
    const c = ensure();
    if (!c || muted) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + start);
    g.gain.linearRampToValueAtTime(vol || 0.05, c.currentTime + start + 0.01);
    g.gain.linearRampToValueAtTime(0, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start);
    o.stop(c.currentTime + start + dur + 0.02);
  }

  const N = { C4: 262, D4: 294, E4: 330, F4: 349, G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, G5: 784, A3: 220, G3: 196 };

  function play(seq, tempo) {
    let t = 0;
    for (const [n, beats] of seq) { if (n) tone(N[n], t, beats * tempo * 0.9, 'square', 0.035); t += beats * tempo; }
  }

  const Sound = {
    unlock() { const c = ensure(); if (c && c.state === 'suspended') c.resume(); },
    toggle() { muted = !muted; return muted; },
    get muted() { return muted; },
    click() { tone(880, 0, 0.03, 'square', 0.03); },
    shot() { tone(140, 0, 0.08, 'sawtooth', 0.06); tone(90, 0.03, 0.1, 'square', 0.04); },
    hit() { tone(660, 0, 0.06); tone(880, 0.06, 0.08); },
    bad() { tone(220, 0, 0.15); tone(165, 0.15, 0.25); },
    good() { tone(523, 0, 0.08); tone(659, 0.08, 0.08); tone(784, 0.16, 0.14); },
    death() { play([['E4', 2], ['D4', 1], ['C4', 3], ['G3', 4]], 0.18); },
    // Opening tune: a short original melody in a folk style.
    title() { play([['G4', 1], ['C5', 1], ['C5', 1], ['D5', 1], ['E5', 2], ['D5', 1], ['C5', 1], ['A4', 2], ['G4', 2], ['C5', 1], ['E5', 1], ['G5', 2], ['E5', 1], ['D5', 1], ['C5', 4]], 0.16); },
    arrive() { play([['C5', 1], ['E5', 1], ['G5', 2]], 0.12); },
    win() { play([['C5', 1], ['E5', 1], ['G5', 1], ['C5', 1], ['E5', 1], ['G5', 2], ['E5', 1], ['G5', 4]], 0.14); },

<script>
/*
 * Green-screen front end: a 40-column terminal under a hi-res picture.
 * Choices are typed (a number, a name, BANG) or tapped. Depends on OT, Art, Sound.
 */
(function () {
  'use strict';
  const OT = window.OT, Art = window.Art, Sound = window.Sound;
  const COLS = 40;
  const FAST = !!window.__TW_FAST;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  canvas.width = Art.W; canvas.height = Art.H;
  const termEl = document.getElementById('term');
  const coarse = matchMedia('(pointer: coarse)').matches;

  let G = null;
  let frame = 0;
  let anim = null;
  let travelOffset = 0;

  // ---------- storage, per-viewer convenience only ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tw1848g:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('tw1848g:' + k, JSON.stringify(v)); } catch (e) { /* unavailable */ } },
    del(k) { try { localStorage.removeItem('tw1848g:' + k); } catch (e) { /* unavailable */ } },
  };
  const autosave = () => { if (G && G.status !== 'won' && G.status !== 'dead') store.set('save', G); };

  // ---------- picture ----------
  function loop() {
    requestAnimationFrame(loop);
    frame++;
    if (!anim) return;
    try { anim(frame); Art.phosphor(ctx); } catch (e) { console.error(e); anim = null; }
  }
  requestAnimationFrame(loop);
  function picture(fn) { anim = fn; canvas.hidden = !fn; }

  function landmarkPicture(id) {
    const lm = OT.LANDMARKS[id];
    picture((f) => Art.landmarkScene(ctx, { id, landmark: lm, weather: G.weather, frame: f, oxen: G.oxen, river: G.river }));
  }

  // ---------- terminal ----------
  // Size the font so exactly 40 columns fit the glass, whatever face loaded.
  function fitTerm() {
    const probe = document.createElement('span');
    probe.textContent = 'M'.repeat(COLS);
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-size:100px;font-family:inherit';
    termEl.append(probe);
    const per100 = probe.offsetWidth; // layout width, so the desktop 2x stretch doesn't skew it
    probe.remove();
    const avail = termEl.clientWidth;
    if (per100 > 0 && avail > 0) termEl.style.fontSize = Math.floor((avail / per100) * 100 * 0.995 * 10) / 10 + 'px';
  }
  fitTerm();
  window.addEventListener('resize', fitTerm);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTerm);

  function wrap(text, width) {
    const out = [];
    for (const para of String(text).split('\n')) {
      if (!para) { out.push(''); continue; }
      let line = '';
      for (const word of para.split(' ')) {
        if (!line) line = word;
        else if ((line + ' ' + word).length <= width) line += ' ' + word;
        else { out.push(line); line = word; }
      }
      out.push(line);
    }
    return out;
  }

  const T = {
    clear() { termEl.replaceChildren(); },
    line(text, cls) {
      const d = document.createElement('div');
      d.className = 'line' + (cls ? ' ' + cls : '');
      d.textContent = text;
      termEl.append(d);
      return d;
    },
    say(text, cls) { for (const l of wrap(text, COLS)) T.line(l, cls); },
    blank() { T.line(''); },
    art(text) {
      const d = document.createElement('div');
      d.className = 'line art';
      d.textContent = text.replace(/^\n/, '').replace(/\s+$/, '');
      termEl.append(d);
    },
    center(text, cls) { T.line(' '.repeat(Math.max(0, Math.floor((COLS - text.length) / 2))) + text, cls); },
    rule() { T.line('-'.repeat(COLS), 'dim'); },
    pair(label, value) { T.line(`${label}`.padEnd(20) + `${value}`); },
  };

  let pending = null; // the one active prompt
  function cancelPending() { if (pending) { pending.cleanup(); pending = null; } }

  // Free-text prompt. Resolves with the typed string.
  function ask(promptText, opts) {
    opts = opts || {};
    cancelPending();
    return new Promise((resolve) => {
      const row = document.createElement('div');
      row.className = 'prompt';
      const label = document.createElement('span');
      label.textContent = promptText;
      const input = document.createElement('input');
      input.id = 'term-input';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.setAttribute('autocapitalize', 'characters');
      input.setAttribute('aria-label', promptText.trim());
      if (opts.maxLength) input.maxLength = opts.maxLength;
      if (opts.numeric) input.inputMode = 'numeric';
      if (opts.placeholder) input.placeholder = opts.placeholder;
      row.append(label, input);
      termEl.append(row);
      const focusIt = () => input.focus({ preventScroll: true });
      if (!coarse || opts.forceFocus) focusIt();
      row.scrollIntoView({ block: 'nearest' });
      const done = (val) => { cleanup(); pending = null; row.replaceWith(Object.assign(document.createElement('div'), { className: 'line', textContent: promptText + val })); resolve(val); };
      const onKey = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); Sound.unlock(); done(input.value.trim()); }

          if (opts.instant(n)) { e.preventDefault(); e.stopPropagation(); Sound.unlock(); done(e.key); }

      input.addEventListener('keydown', onKey);
      termEl.addEventListener('click', onTermClick);

  }

  // A tappable terminal line that submits a number to the active prompt.
  function option(text, n) {
    const el = T.line(text, 'opt');
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    const go = () => { if (pending) { Sound.unlock(); Sound.click(); pending.submit(String(n)); } };
    el.addEventListener('click', (e) => { e.stopPropagation(); go(); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); go(); } });

  }

  // Prompt until one of nums is typed or tapped.
  async function pick(nums, promptText) {
    for (;;) {
      const v = await ask(promptText || 'What is your choice? ', { maxLength: 2, numeric: true, instant: nums.length < 10 ? (n) => nums.includes(n) : null });
      const n = parseInt(v, 10);
      if (nums.includes(n)) { Sound.click(); return n; }
      Sound.bad();
    }
  }

  // Numbered menu. Null entries are skipped but keep their number. Resolves with the index.
  async function choose(options, promptText) {
    const nums = [];
    options.forEach((o, i) => { if (o != null) { nums.push(i + 1); option(`  ${i + 1}. ${o}`, i + 1); } });

  // Wait for Enter, Space, or a tap.

    cancelPending();

      const el = T.line('', 'opt');
      el.append(document.createTextNode(text || 'Press ENTER to continue'), Object.assign(document.createElement('span'), { className: 'cursor', textContent: ' ' }));
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.scrollIntoView({ block: 'nearest' });
      const finish = () => { cleanup(); pending = null; el.remove(); Sound.unlock(); resolve(); };
      const onKey = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(); } };
      const onClick = () => finish();
      window.addEventListener('keydown', onKey);
      termEl.addEventListener('click', onClick);
      canvas.addEventListener('click', onClick);
      function cleanup() { window.removeEventListener('keydown', onKey); termEl.removeEventListener('click', onClick); canvas.removeEventListener('click', onClick); }
      pending = { cleanup, submit: finish };
    });
  }

  async function yesNo(q) {
    for (;;) {
      const v = (await ask(q + ' ', { maxLength: 3 })).toUpperCase();
      if (v.startsWith('Y')) return true;
      if (v.startsWith('N')) return false;
      Sound.bad();
    }
  }

  async function number(q, max) {
    for (;;) {
      const v = await ask(q, { maxLength: 5, numeric: true, forceFocus: true });
      if (v === '') return 0;
      const n = parseInt(v, 10);
      if (Number.isFinite(n) && n >= 0 && n <= max) return n;
      Sound.bad();
      T.say(`Enter a number from 0 to ${max}.`, 'dim');
    }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, FAST ? 0 : ms));
  const money = (n) => '$' + n.toFixed(2);
  const rounds = (boxes) => Math.floor(boxes * 20);
  const paceName = () => OT.PACES.find((p) => p.id === G.pace).name.toLowerCase();
  const ratName = () => OT.RATIONS.find((r) => r.id === G.rations).name.toLowerCase();

  // ---------- ASCII art (drawn for this remake) ----------
  const BANNER = String.raw`
 _____  ___    _    ___  _
|_   _|| _ \  /_\  |_ _|| |
  | |  |   / / _ \  | | | |__
  |_|  |_|_\/_/ \_\|___||____|
 __      __ ___  ___  _____
 \ \    / /| __|/ __||_   _|
  \ \/\/ / | _| \__ \  | |

  const WAGON = String.raw`
        ___________
      /'           '\
     /   _   _   _   \__   ___  ___
    |___________________|=|o__||o__|
     (_)           (_)     "" ""  ""`;

  function tombstone(name, epitaph, date) {
    const inner = 24;
    const c = (t) => { t = String(t).slice(0, inner); const l = Math.floor((inner - t.length) / 2); return '|' + ' '.repeat(l) + t + ' '.repeat(inner - t.length - l) + '|'; };
    return [
      '       ' + '_'.repeat(inner - 6),
      '     /' + ' '.repeat(inner - 2) + '\\',
      '    ' + c(''),
      '    ' + c('HERE LIES'),
      '    ' + c(name.toUpperCase()),
      '    ' + c(''),
      '    ' + c(epitaph || ''),
      '    ' + c(''),
      '    ' + c(date),

  }

  function progressBar() {
    const total = 1907;
    const width = 30;
    const f = Math.min(1, G.milesTraveled / total);

  }

  // Route as a vertical ASCII chart: past, current, and the road ahead.
  function routeLines() {
    const lines = [];
    const visited = new Set(G.path);
    let id = 'independence';
    let miles = 0;
    const seen = new Set();

      seen.add(id);
      const lm = OT.LANDMARKS[id];
      const here = !G.next && G.at === id;

      id = lm.next[idx];
    }

  }

  // ---------- Title ----------
  async function title() {

  function toggleSound() {
    const m = Sound.toggle();
    document.getElementById('mute').textContent = m ? 'SOUND OFF' : 'SOUND ON';
  }
